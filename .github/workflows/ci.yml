name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v7
        with:
          path: project
      - name: Check out repository standards
        uses: actions/checkout@v7
        with:
          repository: lailai0916/lailai-template
          ref: 62ccb68ebc8c4cee53e7bda8816fd08890e0f799
          path: repository-standards
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate shared repository standards
        run: python3 ../repository-standards/scripts/check_repository.py --root . --display-name laiism
      - name: Validate positions and project identity
        run: python3 scripts/check_repository.py
      - name: Test validation gates
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
